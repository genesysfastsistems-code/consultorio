<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Consultorio Médico</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: barra lateral oscura con iconos + área de trabajo clara; en móvil la barra pasa arriba con navegación deslizable. */
:root{
  --bg:#f2f5f7;--surface:#ffffff;--sunk:#f1f5f7;--ink:#0f2530;--muted:#5b707a;--line:#e0e7eb;
  --accent:#0e7c86;--accent-2:#0a626a;--accent-ink:#ffffff;--accent-soft:#dff2f3;
  --side:#0c2a33;--side-ink:#eaf3f5;--side-muted:#93b3bb;--side-act:#16454f;--side-line:#1b3b45;
  --warn-bg:#fdefc4;--warn-ink:#6b4a00;--ok-bg:#d3f1e0;--ok-ink:#0b5030;--bad-bg:#fcdad5;--bad-ink:#8a1b11;
  --shadow:0 1px 2px rgba(15,37,48,.05),0 8px 24px rgba(15,37,48,.06);--ring:0 0 0 3px rgba(14,124,134,.22);
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0a1418;--surface:#122128;--sunk:#0e1b21;--ink:#e4eef1;--muted:#8fa6ae;--line:#22363f;
  --accent:#4cc4c9;--accent-2:#74d7db;--accent-ink:#04262a;--accent-soft:#143a40;
  --side:#07100f;--side-ink:#e4eef1;--side-muted:#8fa6ae;--side-act:#143a40;--side-line:#16272d;
  --warn-bg:#493a0b;--warn-ink:#ffdf8c;--ok-bg:#113f2b;--ok-ink:#a6e7c4;--bad-bg:#561c16;--bad-ink:#ffc2ba;
  --shadow:0 1px 2px rgba(0,0,0,.5);--ring:0 0 0 3px rgba(76,196,201,.3);color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}[hidden]{display:none!important}img{max-width:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2;letter-spacing:-.015em}
h1{font-size:24px;font-weight:800}h2{font-size:16px;font-weight:700}h3{font-size:13.5px;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:none;box-shadow:var(--ring)}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:18px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;gap:11px;align-items:center;padding:4px 6px 14px;border-bottom:1px solid var(--side-line)}
.logo{width:38px;height:38px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.logo svg.i{width:21px;height:21px;stroke-width:2.2}
.brand b{display:block;font-weight:800;font-size:14.5px;line-height:1.2;overflow-wrap:anywhere}
.brand small{display:block;font-size:11.5px;color:var(--side-muted);font-weight:500;margin-top:2px}
nav{display:flex;flex-direction:column;gap:3px}
nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;font-weight:600;font-size:13.5px;color:var(--side-muted);white-space:nowrap;transition:background .15s,color .15s}
nav button:hover{background:var(--side-act);color:var(--side-ink)}
nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
nav button:focus-visible{box-shadow:var(--ring)}
.role{margin-top:auto;border-top:1px solid var(--side-line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.who{display:flex;gap:10px;align-items:center;min-width:0}
.av{width:36px;height:36px;border-radius:50%;background:var(--side-act);color:var(--side-ink);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.who div{min-width:0}.who b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{color:var(--side-muted);font-size:11.5px}
.role .acts{display:flex;gap:6px}
.role .acts button{all:unset;cursor:pointer;flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:7px 8px;border-radius:9px;font-size:12px;font-weight:600;color:var(--side-muted);border:1px solid var(--side-line)}
.role .acts button:hover{background:var(--side-act);color:var(--side-ink)}
.role .acts svg.i{width:15px;height:15px}
main{padding:26px 30px 56px;min-width:0;display:flex;flex-direction:column;gap:18px;max-width:1320px;width:100%}
.vh{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grow{flex:1 1 200px;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:7px;line-height:1.3;transition:border-color .15s,background .15s,transform .05s}
.btn:hover{border-color:var(--accent);background:var(--sunk)}
.btn:active{transform:translateY(1px)}
.btn.p{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 1px 2px rgba(14,124,134,.3)}
.btn.p:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.d{color:var(--bad-ink)}.btn.d:hover{border-color:var(--bad-ink);background:var(--bad-bg)}
.btn.s{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.btn:disabled{opacity:.6;cursor:default}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg .btn{border:0;background:transparent;padding:6px 13px;border-radius:8px}
.seg .btn[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow);color:var(--accent)}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;max-width:100%;transition:border-color .15s,box-shadow .15s}
input:hover,select:hover,textarea:hover{border-color:var(--muted)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);padding:0}
input[type=search]{background-image:none;padding-left:12px}
textarea{width:100%;min-height:70px;resize:vertical}
label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
label>input,label>select{width:100%;color:var(--ink);font-weight:500;font-size:14px}
label>textarea{color:var(--ink);font-weight:500;font-size:14px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.full{grid-column:1/-1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--shadow)}
.muted{color:var(--muted)}.small{font-size:12px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--sunk)}
th:first-child{border-radius:9px 0 0 9px}th:last-child{border-radius:0 9px 9px 0}
thead th{border-bottom:0}
tbody tr:hover{background:var(--sunk)}tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.e-pendiente{background:var(--warn-bg);color:var(--warn-ink)}
.e-atendido{background:var(--ok-bg);color:var(--ok-ink)}
.e-ausente{background:var(--bad-bg);color:var(--bad-ink)}
.neutral{background:var(--sunk);color:var(--muted)}
.banner{border-radius:12px;padding:11px 14px;background:var(--warn-bg);color:var(--warn-ink);font-weight:600}
/* agenda */
.slot{display:grid;grid-template-columns:54px minmax(0,1fr) 32px;gap:10px;align-items:start;border-top:1px dashed var(--line);padding:5px 0;min-height:42px}
.slot.over,.col2.over,.mc.over{background:var(--accent-soft);border-radius:10px}
.sh{color:var(--muted);font-weight:700;font-size:12.5px;padding-top:8px}
.sc{display:flex;flex-wrap:wrap;gap:7px}
.add{all:unset;cursor:pointer;color:var(--muted);text-align:center;border-radius:8px;font-size:18px;line-height:30px;opacity:.45}
.slot:hover .add{opacity:1}.add:hover{background:var(--accent-soft);color:var(--accent)}
.tc{border-radius:10px;padding:7px 11px;cursor:grab;font-weight:600;max-width:100%;overflow-wrap:anywhere;border-left:4px solid currentColor;transition:transform .1s,box-shadow .15s}
.tc:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.tc small{display:block;font-weight:500;opacity:.85}
.tc .pg{font-weight:700;font-size:11px;margin-left:4px}
.week{display:grid;grid-template-columns:repeat(7,minmax(132px,1fr));gap:10px;min-width:960px}
.col2{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:7px;min-height:240px}
.col2>button,.mc>button{all:unset;cursor:pointer;font-weight:700;font-size:12.5px}
.col2.hoy,.mc.hoy{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.mc{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:6px;min-height:92px;display:flex;flex-direction:column;gap:3px;min-width:0}
.mc .tc{padding:1px 6px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left-width:3px;border-radius:6px}
.dow{font-size:11px;font-weight:700;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.06em}
/* paciente */
.alert{border-radius:14px;padding:13px 16px;font-weight:600;display:flex;flex-direction:column;gap:2px}
.alert b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.alert.r{background:var(--bad-bg);color:var(--bad-ink);border:2px solid var(--bad-ink)}
.alert.y{background:var(--warn-bg);color:var(--warn-ink);border:2px solid var(--warn-ink)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px 20px}
.kv div{min-width:0;overflow-wrap:anywhere;font-weight:500}.kv span{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:18px;display:flex;flex-direction:column;gap:10px}
details{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:11px 14px;position:relative}
details::before{content:"";position:absolute;left:-25px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--surface)}
summary{cursor:pointer;font-weight:700}
details>div{display:flex;flex-direction:column;gap:10px;padding-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--accent-soft);border-radius:8px;padding:3px 9px;font-size:12.5px;font-weight:600}
.chip button{all:unset;cursor:pointer;margin-left:6px;font-weight:700}
.sug{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;max-height:190px;overflow:auto;margin-top:4px;box-shadow:var(--shadow)}
.sug:empty{display:none}
.sug button{all:unset;cursor:pointer;padding:8px 11px;border-bottom:1px solid var(--line)}
.sug button:hover{background:var(--accent-soft)}
.rx{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) auto;gap:8px;align-items:center}
.bars{display:flex;align-items:flex-end;gap:4px;height:160px;border-bottom:1px solid var(--line)}
.bars div{flex:1;background:var(--accent);border-radius:5px 5px 0 0;min-height:1px;position:relative;opacity:.9}
.bars div:hover{opacity:1}
.bars div span{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);font-weight:700}
.axis{display:flex;gap:4px;padding-top:4px}.axis span{flex:1;text-align:center;font-size:10px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column-reverse;gap:4px}
.stat b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em;overflow-wrap:anywhere}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
dialog{border:0;border-radius:18px;background:var(--surface);color:var(--ink);padding:26px;width:min(740px,calc(100vw - 24px));max-height:calc(100vh - 32px);box-shadow:0 24px 64px rgba(0,0,0,.28)}
dialog::backdrop{background:rgba(8,20,26,.55);backdrop-filter:blur(3px)}
#dlgc{display:flex;flex-direction:column;gap:16px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;z-index:99;max-width:calc(100vw - 32px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
#toast.err{background:var(--bad-ink);color:var(--bad-bg)}
img.sig{max-height:56px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:3px}
.col{display:flex;flex-direction:column;gap:14px}
#scr{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(900px 500px at 15% 0%,var(--accent-soft),transparent 70%),var(--bg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:34px 30px;width:min(430px,100%);display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 50px rgba(15,37,48,.12)}
.card .logo{width:48px;height:48px;border-radius:14px}.card .logo svg.i{width:26px;height:26px}
.card .btn{justify-content:center;padding:11px 14px}
code{background:var(--sunk);padding:1px 6px;border-radius:5px}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:26px 10px;text-align:center;color:var(--muted)}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;padding:12px 16px;gap:10px}
  .brand{padding-bottom:10px}
  nav{flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .role{flex-direction:row;align-items:center;justify-content:space-between;margin:0;padding-top:10px}
  .role .acts button span{display:none}.role .acts button{flex:none;padding:8px 10px}
  main{padding:18px 16px 44px}
  .rx{grid-template-columns:minmax(0,1fr)}
  .mc{min-height:58px;padding:3px}.mc .tc{font-size:0;padding:3px;height:7px;border-left-width:0}
  dialog{padding:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

  return `<div class="tc e-${t.estado}" draggable="true" data-drag="${f}|${t.id}" data-a="turno" data-f="${f}" data-id="${t.id}" tabindex="0" role="button" title="${EST[t.estado]}"><b>${t.hora}</b> ${esc(pacN(t))}${mini?'':pg+`<small>${esc([EST[t.estado],medN(t.mid),t.motivo].filter(Boolean).join(' · '))}</small>`}</div>`;
}
function slotOf(h){let m=parseInt(h)*60+parseInt(h.slice(3));m=Math.min(Math.max(m,420),1230);m-=m%30;return p2(m/60|0)+':'+p2(m%60)}
const lunes=f=>{const d=pd(f);return addD(f,-((d.getDay()+6)%7))};
function agBody(){
  const f=S.ag.f,h=hoy();ensureMonth(f.slice(0,7));
  if(S.ag.modo==='dia'){
    const ts=turnos(f),by={};ts.forEach(t=>(by[slotOf(t.hora)]=by[slotOf(t.hora)]||[]).push(t));
    let o='';for(let m=420;m<=1230;m+=30){const s=p2(m/60|0)+':'+p2(m%60);o+=`<div class="slot" data-drop data-fecha="${f}" data-hora="${s}"><span class="sh">${s}</span><div class="sc">${(by[s]||[]).map(t=>card(f,t)).join('')}</div><button class="add" data-a="nturno" data-f="${f}" data-h="${s}" aria-label="Nuevo turno a las ${s}">+</button></div>`}
    return `<div class="panel"><h2>${esc(fdate(f,{weekday:'long',day:'numeric',month:'long',year:'numeric'}))} <span class="muted small">· ${ts.length} turno${ts.length===1?'':'s'}</span></h2><div>${o}</div></div>`;
  }
  if(S.ag.modo==='semana'){
    const l=lunes(f);ensureMonth(l.slice(0,7));let o='';
    for(let i=0;i<7;i++){const d=addD(l,i);o+=`<div class="col2 ${d===h?'hoy':''}" data-drop data-fecha="${d}"><button data-a="agdia" data-f="${d}">${esc(fdate(d,{weekday:'short',day:'numeric',month:'short'}))}</button>${turnos(d).map(t=>card(d,t)).join('')||'<span class="muted small">Sin turnos</span>'}</div>`}
    return `<div class="scroll"><div class="week">${o}</div></div>`;
  }
  const a=pd(f),first=new Date(a.getFullYear(),a.getMonth(),1),n=new Date(a.getFullYear(),a.getMonth()+1,0).getDate(),off=(first.getDay()+6)%7;
  let o=['lun','mar','mié','jue','vie','sáb','dom'].map(x=>`<div class="dow">${x}</div>`).join('')+'<div></div>'.repeat(off);
  for(let i=1;i<=n;i++){const d=f.slice(0,8)+p2(i),ts=turnos(d);o+=`<div class="mc ${d===h?'hoy':''}" data-drop data-fecha="${d}"><button data-a="agdia" data-f="${d}" aria-label="Ver día ${i}">${i}${ts.length?` <span class="muted">· ${ts.length}</span>`:''}</button>${ts.slice(0,3).map(t=>card(d,t,1)).join('')}${ts.length>3?`<span class="muted small">+${ts.length-3} más</span>`:''}</div>`}
  return `<div class="panel"><h2>${esc(fdate(f,{month:'long',year:'numeric'}))}</h2><div class="month">${o}</div></div>`;
}
function agRes(){
  const q=norm(S.ag.q);if(q.length<2)return'';
  const r=[];Object.keys(D.agenda).sort().reverse().forEach(f=>turnos(f).forEach(t=>{if(norm(pacN(t)).includes(q))r.push([f,t])}));
  return `<div class="panel"><h2>Resultados para “${esc(S.ag.q)}”</h2>${r.length?`<div class="row">${r.slice(0,40).map(([f,t])=>`<div><span class="muted small">${esc(fdate(f))}</span>${card(f,t)}</div>`).join('')}</div>`:'<p class="muted">Ningún turno coincide con ese nombre en los meses cargados.</p>'}</div>`;
}

function moveTurno(f0,id,f1,h1){
  const d0=D.agenda[f0];if(!d0||!d0.turnos||!d0.turnos[id])return;
  const t=clone(d0.turnos[id]);if(h1)t.hora=h1;
  if(f0===f1){if(!h1||h1===d0.turnos[id].hora)return;write('agenda',f0,{turnos:{[id]:{hora:h1}}},'merge')}
  else{delKey('agenda',f0,'turnos',id);write('agenda',f1,{fecha:f1,turnos:{[id]:t}},'merge')}
  log('Movió turno',pacN(t)+': '+f0+' → '+f1+' '+t.hora);toast('Turno movido al '+fdate(f1)+', '+t.hora);
}

/* ---------- PDF ---------- */
function pdf(tipo,pid,cid){
  const J=window.jspdf&&window.jspdf.jsPDF;if(!J){toast('No se pudo cargar el generador de PDF. Revisá la conexión.',1);return}
  const p=D.pacientes[pid],c=D.clinico[pid].cons[cid],cf=cfg(),hj=HOJAS[cf.hoja]||HOJAS.media,W=hj[1],H=hj[2],m=W<160?12:20;
  const doc=new J({unit:'mm',format:[W,H]}),md=D.medicos[c.mid]||{},fi=D.firmas[c.mid]||{};
  let y=m+4;
  doc.setFont('helvetica','bold');doc.setFontSize(14);doc.text(doc.splitTextToSize(cf.nombre||(EMP&&EMP.nombre)||'Consultorio médico',W*0.55),m,y);y+=5.5;
  doc.setFont('helvetica','normal');doc.setFontSize(8.5);
  [cf.direccion,cf.telefono&&'Tel. '+cf.telefono,cf.ruc&&'RUC '+cf.ruc].filter(Boolean).forEach(l=>{doc.text(String(l),m,y);y+=4});
  doc.setFont('helvetica','bold');doc.setFontSize(10);doc.text(md.nombre||'',W-m,m+4,{align:'right'});
  doc.setFont('helvetica','normal');doc.setFontSize(8.5);
  if(md.esp)doc.text(md.esp,W-m,m+8.5,{align:'right'});if(md.reg)doc.text('Reg. Prof. N° '+md.reg,W-m,m+12.5,{align:'right'});
  y=Math.max(y,m+16);doc.setDrawColor(70);doc.line(m,y,W-m,y);y+=6;
  doc.setFontSize(9.5);doc.text('Paciente: '+p.nombre,m,y);doc.text('Fecha: '+fdate(c.fecha,{day:'2-digit',month:'2-digit',year:'numeric'}),W-m,y,{align:'right'});y+=5;
  doc.text('CI: '+(p.ci||'—')+(p.nac?'     Edad: '+edad(p.nac):''),m,y);y+=9;
  doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text(tipo==='receta'?'Rp/':'ORDEN DE ESTUDIOS',m,y);y+=7;
  doc.setFontSize(10.5);
  const lim=H-m-36,items=tipo==='receta'?(c.rx||[]).map(r=>[r.m,r.i]):(c.est||[]).map(e=>[e,'']);
  items.forEach((it,i)=>{
    const a=doc.splitTextToSize((i+1)+'. '+it[0],W-2*m),b=it[1]?doc.splitTextToSize(it[1],W-2*m-6):[];
    if(y+a.length*5+b.length*4.6+3>lim){doc.addPage();y=m+6}
    doc.setFont('helvetica','bold');doc.text(a,m,y);y+=a.length*5;
    if(b.length){doc.setFont('helvetica','normal');doc.text(b,m+6,y);y+=b.length*4.6}
    y+=3});
  if(tipo==='orden'&&c.dx&&c.dx.length){const t=doc.splitTextToSize('Diagnóstico presuntivo: '+c.dx.map(d=>(d.c?d.c+' ':'')+d.d).join('; '),W-2*m);if(y+t.length*4.6>lim){doc.addPage();y=m+6}doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.text(t,m,y+2)}
  const ly=H-m-12,lx=W-m-58;
  const img=(d,x,mw,mh)=>{try{const ip=doc.getImageProperties(d),r=Math.min(mw/ip.width,mh/ip.height);doc.addImage(d,x,ly-1-ip.height*r,ip.width*r,ip.height*r)}catch(e){}};
  if(fi.firma)img(fi.firma,lx+6,46,20);
  if(fi.sello)img(fi.sello,Math.max(m,lx-34),30,24);
  doc.line(lx,ly,W-m,ly);doc.setFont('helvetica','bold');doc.setFontSize(9);doc.text(md.nombre||'Firma y sello',lx+29,ly+4,{align:'center'});
  doc.setFont('helvetica','normal');doc.setFontSize(8);if(md.reg)doc.text('Reg. Prof. N° '+md.reg,lx+29,ly+8,{align:'center'});
  const name=(tipo==='receta'?'Receta':'Orden')+' '+p.nombre.replace(/[^\p{L}\p{N} ]/gu,'')+' '+c.fecha+'.pdf';
  const w=window.open(doc.output('bloburl'),'_blank');if(!w)doc.save(name);
  log('Generó '+(tipo==='receta'?'receta':'orden')+' en PDF',p.nombre);
}
function bajar(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}

/* ---------- CAJA ---------- */
function vCaja(){
  const f=S.cajaF;ensureMonth(f.slice(0,7));const day=D.agenda[f]||{},ts=Object.entries(day.turnos||{}).map(([id,t])=>Object.assign({id},t)).sort((a,b)=>a.hora.localeCompare(b.hora));
  const tot={efectivo:0,transferencia:0,tarjeta:0};let debe=0,nd=0,nc=0;
  ts.forEach(t=>{const g=t.pago||{};if(g.e==='pagado')tot[g.medio||'efectivo']+=+g.monto||0;else if(g.e==='debe'){debe+=+g.monto||0;nd++}else if(g.e==='convenio')nc++});
  const total=tot.efectivo+tot.transferencia+tot.tarjeta,ci=day.cierre;
  return `<div class="vh"><h1>Caja</h1><input type="date" id="cajaf" data-c="cajaf" value="${f}" aria-label="Fecha de caja"></div>
  <div class="stats"><div class="stat"><b>${gs(tot.efectivo)}</b><span>Efectivo</span></div><div class="stat"><b>${gs(tot.transferencia)}</b><span>Transferencias</span></div><div class="stat"><b>${gs(tot.tarjeta)}</b><span>Tarjetas</span></div><div class="stat"><b>${gs(total)}</b><span>Total cobrado</span></div><div class="stat"><b>${gs(debe)}</b><span>Pendiente de cobro (${nd})</span></div><div class="stat"><b>${nc}</b><span>Por convenio / seguro</span></div></div>
  <div class="panel"><h2>Pagos del ${esc(fdate(f))}</h2>${ts.length?`<div class="scroll"><table><thead><tr><th>Hora</th><th>Paciente</th><th>Situación</th><th>Medio</th><th>Convenio</th><th class="n">Monto</th><th></th></tr></thead><tbody>${ts.map(t=>{const g=t.pago||{};return `<tr><td>${t.hora}</td><td>${esc(pacN(t))}</td><td><span class="pill ${g.e==='pagado'?'e-atendido':g.e==='debe'?'e-ausente':g.e==='convenio'?'e-pendiente':'neutral'}">${PAGO[g.e||'']}</span></td><td>${g.e==='pagado'?MEDIOS[g.medio||'efectivo']:'—'}</td><td>${esc(g.conv||'—')}</td><td class="n">${g.monto?gs(g.monto):'—'}</td><td><button class="btn s" data-a="turno" data-f="${f}" data-id="${t.id}">Registrar pago</button></td></tr>`}).join('')}</tbody></table></div>`:'<p class="muted">No hay turnos en esta fecha.</p>'}</div>
  <div class="panel"><h2>Cierre de caja</h2>${ci?`<p><span class="pill e-atendido">Caja cerrada</span> a las ${esc(new Date(ci.t).toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'}))}. Efectivo según sistema ${gs(ci.ef)}, contado ${gs(ci.contado)}, diferencia <b>${gs(ci.contado-ci.ef)}</b>.</p>`:''}
    <form data-s="cierre" class="row"><label>Efectivo contado en caja<input type="number" name="contado" id="cj_contado" min="0" step="any" required value="${ci?ci.contado:''}"></label><button class="btn p" style="align-self:flex-end">${ci?'Volver a cerrar':'Cerrar caja del día'}</button></form>
    <p class="small muted">El cierre compara el efectivo contado con ${gs(tot.efectivo)} registrado en efectivo. Transferencias y tarjetas se verifican contra el extracto.</p></div>`;
}

function waNum(t){let d=String(t||'').replace(/\D/g,'');if(!d)return'';const pre=String(cfg().prefijo||'595');if(d.startsWith('0'))d=pre+d.slice(1);return d}

function vReportes(){

  const mx=Math.max(1,...per),nuevos=Object.values(D.pacientes).filter(p=>(p.reg||'').startsWith(mth)).length,h=hoy(),th=Object.entries((D.agenda[h]||{}).turnos||{}).map(([id,t])=>Object.assign({id},t)).sort((a,b)=>a.hora.localeCompare(b.hora));
  const aus=at+au?Math.round(au*100/(at+au)):0;

}

async function cuentaDe(u){
  u=String(u).trim().toLowerCase();if(u.includes('@'))return u;
  try{const d=await fs.doc('logins/'+u).get();if(d.exists)return d.data().email}catch(e){}
  return u+UDOM;
}
function cuentaSec(){return (firebase.apps.find(a=>a.name==='sec')||firebase.initializeApp(FB,'sec')).auth()}
async function crearUsuario(us,pass,doc){
  const lg=await fs.doc('logins/'+us).get();
  if(lg.exists||Object.values(P.users).some(u=>uName(u)===us))throw{code:'auth/email-already-in-use'};
  const email=us+'.'+nid()+UDOM,sec=cuentaSec(),c=await sec.createUserWithEmailAndPassword(email,pass);await sec.signOut();
  const b=fs.batch();
  b.set(fs.doc('usuarios/'+c.user.uid),Object.assign({creado:Date.now()},doc,{email,usuario:us,debeCambiar:true,activo:true}));
  b.set(fs.doc('logins/'+us),{email,empresaId:doc.empresaId,uid:c.user.uid});
  await b.commit();return c.user.uid;

function imgData(file,maxW,type,maxLen){return new Promise(res=>{if(!file||!file.size)return res(null);const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{let w=Math.min(maxW,im.width),u;do{const c=document.createElement('canvas');c.width=w;c.height=Math.round(im.height*w/im.width);const x=c.getContext('2d');if(type==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(im,0,0,c.width,c.height);u=c.toDataURL(type,.8);w=Math.round(w*.75)}while(u.length>maxLen&&w>60);res(u)};im.onerror=()=>res(null);im.src=r.result};r.onerror=()=>res(null);r.readAsDataURL(file)})}
const fileData=f=>new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>res(null);r.readAsDataURL(f)});

function estEmp(e){
  if(e.estado!=='activa')return['Suspendida','e-ausente',0];
  if(e.vence==null)return['De por vida','e-atendido',1];
  const dd=Math.ceil((e.vence.toDate()-new Date())/864e5),f=e.vence.toDate().toLocaleDateString('es',{day:'2-digit',month:'short',year:'numeric'});
  if(dd<=0)return['Vencida el '+f,'e-ausente',0];
  if(dd<=7)return['Vence en '+dd+' día'+(dd===1?'':'s'),'e-pendiente',1];
  return['Activa hasta '+f,'e-atendido',1];
}

  if(!FB.apiKey||/^PEGAR/.test(FB.apiKey)){screen('<h1>Falta conectar la base de datos</h1><p>Abrí <b>index.html</b>, buscá <code>const FB</code> al inicio del script y pegá ahí la configuración de tu proyecto de Firebase. Los pasos están en el archivo <b>LEEME.md</b>.</p>');return}
  firebase.initializeApp(FB);auth=firebase.auth();fs=firebase.firestore();
  try{fs.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
  screen('<span class="logo">'+ic('logo')+'</span><h1>Consultorio Médico</h1><p class="muted">Abriendo…</p>');
  auth.onAuthStateChanged(entrar);
})();
</script>
</body>
</html>
