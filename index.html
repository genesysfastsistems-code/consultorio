<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Consultorio Médico</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: barra lateral oscura con iconos + área de trabajo clara; en móvil la barra pasa arriba con navegación deslizable. */
:root{
  --bg:#f2f5f7;--surface:#ffffff;--sunk:#f1f5f7;--ink:#0f2530;--muted:#5b707a;--line:#e0e7eb;
  --accent:#0e7c86;--accent-2:#0a626a;--accent-ink:#ffffff;--accent-soft:#dff2f3;
  --side:#0c2a33;--side-ink:#eaf3f5;--side-muted:#93b3bb;--side-act:#16454f;--side-line:#1b3b45;
  --warn-bg:#fdefc4;--warn-ink:#6b4a00;--ok-bg:#d3f1e0;--ok-ink:#0b5030;--bad-bg:#fcdad5;--bad-ink:#8a1b11;
  --shadow:0 1px 2px rgba(15,37,48,.05),0 8px 24px rgba(15,37,48,.06);--ring:0 0 0 3px rgba(14,124,134,.22);
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){.frio{background:#12324a;color:#a9d4f5}
:root{
  --bg:#0a1418;--surface:#122128;--sunk:#0e1b21;--ink:#e4eef1;--muted:#8fa6ae;--line:#22363f;
  --accent:#4cc4c9;--accent-2:#74d7db;--accent-ink:#04262a;--accent-soft:#143a40;
  --side:#07100f;--side-ink:#e4eef1;--side-muted:#8fa6ae;--side-act:#143a40;--side-line:#16272d;
  --warn-bg:#493a0b;--warn-ink:#ffdf8c;--ok-bg:#113f2b;--ok-ink:#a6e7c4;--bad-bg:#561c16;--bad-ink:#ffc2ba;
  --shadow:0 1px 2px rgba(0,0,0,.5);--ring:0 0 0 3px rgba(76,196,201,.3);color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}[hidden]{display:none!important}img{max-width:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2;letter-spacing:-.015em}
h1{font-size:24px;font-weight:800}h2{font-size:16px;font-weight:700}h3{font-size:13.5px;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:none;box-shadow:var(--ring)}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:18px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;gap:11px;align-items:center;padding:4px 6px 14px;border-bottom:1px solid var(--side-line)}
.logo{width:38px;height:38px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.logo svg.i{width:21px;height:21px;stroke-width:2.2}
.brand b{display:block;font-weight:800;font-size:14.5px;line-height:1.2;overflow-wrap:anywhere}
.brand small{display:block;font-size:11.5px;color:var(--side-muted);font-weight:500;margin-top:2px}
nav{display:flex;flex-direction:column;gap:3px}
nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;font-weight:600;font-size:13.5px;color:var(--side-muted);white-space:nowrap;transition:background .15s,color .15s}
nav button:hover{background:var(--side-act);color:var(--side-ink)}
nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
nav button:focus-visible{box-shadow:var(--ring)}
.role{margin-top:auto;border-top:1px solid var(--side-line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.who{display:flex;gap:10px;align-items:center;min-width:0}
.av{width:36px;height:36px;border-radius:50%;background:var(--side-act);color:var(--side-ink);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.who div{min-width:0}.who b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{color:var(--side-muted);font-size:11.5px;overflow-wrap:anywhere}
.role .acts{display:flex;gap:6px}
.role .acts button{all:unset;cursor:pointer;flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:7px 8px;border-radius:9px;font-size:12px;font-weight:600;color:var(--side-muted);border:1px solid var(--side-line)}
.role .acts button:hover{background:var(--side-act);color:var(--side-ink)}
.role .acts svg.i{width:15px;height:15px}
main{padding:26px 30px 56px;min-width:0;display:flex;flex-direction:column;gap:18px;max-width:1320px;width:100%}
.vh{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grow{flex:1 1 200px;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:7px;line-height:1.3;transition:border-color .15s,background .15s,transform .05s}
.btn:hover{border-color:var(--accent);background:var(--sunk)}
.btn:active{transform:translateY(1px)}
.btn.p{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 1px 2px rgba(14,124,134,.3)}
.btn.p:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.d{color:var(--bad-ink)}.btn.d:hover{border-color:var(--bad-ink);background:var(--bad-bg)}
.btn.s{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.btn:disabled{opacity:.6;cursor:default}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg .btn{border:0;background:transparent;padding:6px 13px;border-radius:8px}
.seg .btn[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow);color:var(--accent)}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;max-width:100%;transition:border-color .15s,box-shadow .15s}
input:hover,select:hover,textarea:hover{border-color:var(--muted)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);padding:0}
textarea{width:100%;min-height:70px;resize:vertical}
label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
label>input,label>select{width:100%;color:var(--ink);font-weight:500;font-size:14px}
label>textarea{color:var(--ink);font-weight:500;font-size:14px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.full{grid-column:1/-1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--shadow)}
.muted{color:var(--muted)}.small{font-size:12px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--sunk)}
th:first-child{border-radius:9px 0 0 9px}th:last-child{border-radius:0 9px 9px 0}
thead th{border-bottom:0}
tbody tr:hover{background:var(--sunk)}tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.e-pendiente{background:var(--warn-bg);color:var(--warn-ink)}
.e-atendido{background:var(--ok-bg);color:var(--ok-ink)}
.e-ausente{background:var(--bad-bg);color:var(--bad-ink)}
.neutral{background:var(--sunk);color:var(--muted)}
.banner{border-radius:12px;padding:11px 14px;background:var(--warn-bg);color:var(--warn-ink);font-weight:600}
.slot{display:grid;grid-template-columns:54px minmax(0,1fr) 32px;gap:10px;align-items:start;border-top:1px dashed var(--line);padding:5px 0;min-height:42px}
.slot.over,.col2.over,.mc.over{background:var(--accent-soft);border-radius:10px}
.sh{color:var(--muted);font-weight:700;font-size:12.5px;padding-top:8px}
.sc{display:flex;flex-wrap:wrap;gap:7px}
.add{all:unset;cursor:pointer;color:var(--muted);text-align:center;border-radius:8px;font-size:18px;line-height:30px;opacity:.45}
.slot:hover .add{opacity:1}.add:hover{background:var(--accent-soft);color:var(--accent)}
.tc{border-radius:10px;padding:7px 11px;cursor:grab;font-weight:600;max-width:100%;overflow-wrap:anywhere;border-left:4px solid currentColor;transition:transform .1s,box-shadow .15s}
.tc:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.tc small{display:block;font-weight:500;opacity:.85}
.tc .pg{font-weight:700;font-size:11px;margin-left:4px}
.week{display:grid;grid-template-columns:repeat(7,minmax(132px,1fr));gap:10px;min-width:960px}
.col2{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:7px;min-height:240px}
.col2>button,.mc>button{all:unset;cursor:pointer;font-weight:700;font-size:12.5px}
.col2.hoy,.mc.hoy{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.mc{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:6px;min-height:92px;display:flex;flex-direction:column;gap:3px;min-width:0}
.mc .tc{padding:1px 6px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left-width:3px;border-radius:6px}
.dow{font-size:11px;font-weight:700;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.06em}
.alert{border-radius:14px;padding:13px 16px;font-weight:600;display:flex;flex-direction:column;gap:2px}
.alert b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.alert.r{background:var(--bad-bg);color:var(--bad-ink);border:2px solid var(--bad-ink)}
.alert.y{background:var(--warn-bg);color:var(--warn-ink);border:2px solid var(--warn-ink)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px 20px}
.kv div{min-width:0;overflow-wrap:anywhere;font-weight:500}.kv span{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:18px;display:flex;flex-direction:column;gap:10px}
details{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:11px 14px;position:relative}
details::before{content:"";position:absolute;left:-25px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--surface)}
summary{cursor:pointer;font-weight:700}
details>div{display:flex;flex-direction:column;gap:10px;padding-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--accent-soft);border-radius:8px;padding:3px 9px;font-size:12.5px;font-weight:600}
.chip button{all:unset;cursor:pointer;margin-left:6px;font-weight:700}
.sug{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;max-height:190px;overflow:auto;margin-top:4px;box-shadow:var(--shadow)}
.sug:empty{display:none}
.sug button{all:unset;cursor:pointer;padding:8px 11px;border-bottom:1px solid var(--line)}
.sug button:hover{background:var(--accent-soft)}
.rx{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) auto;gap:8px;align-items:center}
.bars{display:flex;align-items:flex-end;gap:4px;height:160px;border-bottom:1px solid var(--line)}
.bars div{flex:1;background:var(--accent);border-radius:5px 5px 0 0;min-height:1px;position:relative;opacity:.9}
.bars div:hover{opacity:1}
.bars div span{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);font-weight:700}
.axis{display:flex;gap:4px;padding-top:4px}.axis span{flex:1;text-align:center;font-size:10px;color:var(--muted)}
.hb{height:8px;background:var(--sunk);border-radius:9px;overflow:hidden;min-width:70px}.hb i{display:block;height:100%;background:var(--accent);border-radius:9px}
.rbt{display:flex;gap:10px;align-items:flex-start}.dot{width:10px;height:10px;margin-top:6px;border-radius:50%;flex:none;background:var(--muted)}.dot.on{background:#1f9d5c;box-shadow:0 0 0 4px rgba(31,157,92,.18)}.dot.off{background:#d14b3a}
.vars code{background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:12px}
.sem-g{background:var(--ok-bg);color:var(--ok-ink)}.sem-y{background:var(--warn-bg);color:var(--warn-ink)}.sem-r{background:var(--bad-bg);color:var(--bad-ink)}
.frio{background:#dcecfb;color:#0b4a7a}
.cnt{display:inline-block;background:var(--bad-ink);color:#fff;border-radius:99px;padding:0 6px;font-size:11px;line-height:17px;margin-left:2px}
.pos{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}.pos .col{display:flex;flex-direction:column;gap:18px;min-width:0}
@media (max-width:1050px){.pos{grid-template-columns:minmax(0,1fr)}}
.res{display:flex;flex-direction:column;max-height:430px;overflow:auto}.ri{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);flex-wrap:wrap}.ri:last-child{border-bottom:0}
.bad{color:var(--bad-ink)}.lnk{all:unset;cursor:pointer;color:var(--accent);font-weight:700;text-decoration:underline}
.tot{display:flex;flex-direction:column;gap:6px}.tot div{display:flex;justify-content:space-between;gap:10px}.tot span{color:var(--muted)}.tot .big{font-size:18px;border-top:1px solid var(--line);padding-top:8px}.tot .big span{color:var(--ink);font-weight:700}
.btn.big{justify-content:center;padding:13px;font-size:15px;width:100%}
label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:13.5px}
.cart select{padding:6px 8px}.cart td,.cart th{padding:9px 8px}
.seg .btn{white-space:nowrap}
@media (max-width:640px){table.cart thead{display:none}table.cart tr{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line)}table.cart td{border:0;padding:2px 0}table.cart td:first-child{grid-column:1/-1}table.cart td.n{text-align:left}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column-reverse;gap:4px}
.stat b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em;overflow-wrap:anywhere}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
dialog{border:0;border-radius:18px;background:var(--surface);color:var(--ink);padding:26px;width:min(740px,calc(100vw - 24px));max-height:calc(100vh - 32px);box-shadow:0 24px 64px rgba(0,0,0,.28)}
dialog::backdrop{background:rgba(8,20,26,.55);backdrop-filter:blur(3px)}
#dlgc{display:flex;flex-direction:column;gap:16px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;z-index:99;max-width:calc(100vw - 32px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
#toast.err{background:var(--bad-ink);color:var(--bad-bg)}
img.sig{max-height:56px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:3px}
.col{display:flex;flex-direction:column;gap:14px}
#scr{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(900px 500px at 15% 0%,var(--accent-soft),transparent 70%),var(--bg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:34px 30px;width:min(430px,100%);display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 50px rgba(15,37,48,.12)}
.card .logo{width:48px;height:48px;border-radius:14px}.card .logo svg.i{width:26px;height:26px}
.card .btn{justify-content:center;padding:11px 14px}
code{background:var(--sunk);padding:1px 6px;border-radius:5px}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;padding:12px 16px;gap:10px}
  .brand{padding-bottom:10px}
  nav{flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .role{flex-direction:row;align-items:center;justify-content:space-between;margin:0;padding-top:10px}
  .role .acts button span{display:none}.role .acts button{flex:none;padding:8px 10px}
  main{padding:18px 16px 44px}
  .rx{grid-template-columns:minmax(0,1fr)}
  .mc{min-height:58px;padding:3px}.mc .tc{font-size:0;padding:3px;height:7px;border-left-width:0}
  dialog{padding:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
"use strict";
/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const p2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const pd=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const hoy=()=>ymd(new Date());
const fdate=(s,o)=>s?pd(s).toLocaleDateString('es',o||{day:'2-digit',month:'short',year:'numeric'}):'—';
const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const edad=n=>{if(!n)return'';const b=pd(n),t=new Date();let a=t.getFullYear()-b.getFullYear();if(t<new Date(t.getFullYear(),b.getMonth(),b.getDate()))a--;return a+' años'};
function toast(m,err){const t=$('#toast');t.textContent=m;t.className=err?'err':'';t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,4200)}
const tmpPass=()=>Math.random().toString(36).slice(2,6)+Math.floor(1000+Math.random()*9000);

/* ---------- catálogos ---------- */
const CIE=`A09|Diarrea y gastroenteritis de presunto origen infeccioso
A90|Fiebre del dengue (dengue clásico)
A91|Fiebre del dengue hemorrágico
A92.0|Enfermedad por virus Chikungunya
B34.9|Infección viral, no especificada
B35.3|Tiña del pie
B37.3|Candidiasis de la vulva y de la vagina
B82.9|Parasitosis intestinal, sin otra especificación

function card(f,t,mini){
  const pg=t.pago&&t.pago.e?` <span class="pg">${t.pago.e==='pagado'?'✓ pagó':t.pago.e==='debe'?'debe':'convenio'}</span>`:'';
  return `<div class="tc e-${t.estado}" draggable="true" data-drag="${f}|${t.id}" data-a="turno" data-f="${f}" data-id="${t.id}" tabindex="0" role="button" title="${EST[t.estado]}"><b>${t.hora}</b> ${esc(pacN(t))}${t.conf===true?' ✓':t.conf===false?' ✕':''}${mini?'':pg+`<small>${esc([EST[t.estado],t.conf===true?'Confirmó':t.conf===false?'Avisó que no viene':'',medN(t.mid),t.motivo].filter(Boolean).join(' · '))}</small>`}</div>`;
}
function slotOf(h){let m=parseInt(h)*60+parseInt(h.slice(3));m=Math.min(Math.max(m,420),1230);m-=m%30;return p2(m/60|0)+':'+p2(m%60)}
const lunes=f=>{const d=pd(f);return addD(f,-((d.getDay()+6)%7))};
function agBody(){
  const f=S.ag.f,h=hoy();ensureMonth(f.slice(0,7));
  if(S.ag.modo==='dia'){
    const ts=turnos(f),by={};ts.forEach(t=>(by[slotOf(t.hora)]=by[slotOf(t.hora)]||[]).push(t));
    let o='';for(let m=420;m<=1230;m+=30){const s=p2(m/60|0)+':'+p2(m%60);o+=`<div class="slot" data-drop data-fecha="${f}" data-hora="${s}"><span class="sh">${s}</span><div class="sc">${(by[s]||[]).map(t=>card(f,t)).join('')}</div><button class="add" data-a="nturno" data-f="${f}" data-h="${s}" aria-label="Nuevo turno a las ${s}">+</button></div>`}
    return `<div class="panel"><h2>${esc(fdate(f,{weekday:'long',day:'numeric',month:'long',year:'numeric'}))} <span class="muted small">· ${ts.length} turno${ts.length===1?'':'s'}</span></h2><div>${o}</div></div>`;
  }
  if(S.ag.modo==='semana'){
    const l=lunes(f);ensureMonth(l.slice(0,7));let o='';
    for(let i=0;i<7;i++){const d=addD(l,i);o+=`<div class="col2 ${d===h?'hoy':''}" data-drop data-fecha="${d}"><button data-a="agdia" data-f="${d}">${esc(fdate(d,{weekday:'short',day:'numeric',month:'short'}))}</button>${turnos(d).map(t=>card(d,t)).join('')||'<span class="muted small">Sin turnos</span>'}</div>`}
    return `<div class="scroll"><div class="week">${o}</div></div>`;
  }
  const a=pd(f),first=new Date(a.getFullYear(),a.getMonth(),1),n=new Date(a.getFullYear(),a.getMonth()+1,0).getDate(),off=(first.getDay()+6)%7;
  let o=['lun','mar','mié','jue','vie','sáb','dom'].map(x=>`<div class="dow">${x}</div>`).join('')+'<div></div>'.repeat(off);
  for(let i=1;i<=n;i++){const d=f.slice(0,8)+p2(i),ts=turnos(d);o+=`<div class="mc ${d===h?'hoy':''}" data-drop data-fecha="${d}"><button data-a="agdia" data-f="${d}" aria-label="Ver día ${i}">${i}${ts.length?` <span class="muted">· ${ts.length}</span>`:''}</button>${ts.slice(0,3).map(t=>card(d,t,1)).join('')}${ts.length>3?`<span class="muted small">+${ts.length-3} más</span>`:''}</div>`}
  return `<div class="panel"><h2>${esc(fdate(f,{month:'long',year:'numeric'}))}</h2><div class="month">${o}</div></div>`;
}
function agRes(){
  const q=norm(S.ag.q);if(q.length<2)return'';

  return `<div class="panel"><h2>Resultados para “${esc(S.ag.q)}”</h2>${r.length?`<div class="row">${r.slice(0,40).map(([f,t])=>`<div><span class="muted small">${esc(fdate(f))}</span>${card(f,t)}</div>`).join('')}</div>`:'<p class="muted">Ningún turno coincide con ese nombre en los meses cargados.</p>'}</div>`;
}

function moveTurno(f0,id,f1,h1){
  const d0=D.agenda[f0];if(!d0||!d0.turnos||!d0.turnos[id])return;

}

/* ---------- PDF ---------- */
function pdf(tipo,pid,cid){
  const J=window.jspdf&&window.jspdf.jsPDF;if(!J){toast('No se pudo cargar el generador de PDF. Revisá la conexión.',1);return}
  const p=D.pacientes[pid],c=D.clinico[pid].cons[cid],cf=cfg(),hj=HOJAS[cf.hoja]||HOJAS.media,W=hj[1],H=hj[2],m=W<160?12:20;
  const doc=new J({unit:'mm',format:[W,H]}),md=D.medicos[c.mid]||{},fi=D.firmas[c.mid]||{};
  let y=m+4;
  doc.setFont('helvetica','bold');doc.setFontSize(14);doc.text(doc.splitTextToSize(cf.nombre||(EMP&&EMP.nombre)||'Consultorio médico',W*0.55),m,y);y+=5.5;
  doc.setFont('helvetica','normal');doc.setFontSize(8.5);
  [cf.direccion,cf.telefono&&'Tel. '+cf.telefono,cf.ruc&&'RUC '+cf.ruc].filter(Boolean).forEach(l=>{doc.text(String(l),m,y);y+=4});
  doc.setFont('helvetica','bold');doc.setFontSize(10);doc.text(md.nombre||'',W-m,m+4,{align:'right'});
  doc.setFont('helvetica','normal');doc.setFontSize(8.5);
  if(md.esp)doc.text(md.esp,W-m,m+8.5,{align:'right'});if(md.reg)doc.text('Reg. Prof. N° '+md.reg,W-m,m+12.5,{align:'right'});
  y=Math.max(y,m+16);doc.setDrawColor(70);doc.line(m,y,W-m,y);y+=6;
  doc.setFontSize(9.5);doc.text('Paciente: '+p.nombre,m,y);doc.text('Fecha: '+fdate(c.fecha,{day:'2-digit',month:'2-digit',year:'numeric'}),W-m,y,{align:'right'});y+=5;
  doc.text('CI: '+(p.ci||'—')+(p.nac?'     Edad: '+edad(p.nac):''),m,y);y+=9;
  doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text(tipo==='receta'?'Rp/':'ORDEN DE ESTUDIOS',m,y);y+=7;
  doc.setFontSize(10.5);
  const lim=H-m-36,items=tipo==='receta'?(c.rx||[]).map(r=>[r.m,r.i]):(c.est||[]).map(e=>[e,'']);
  items.forEach((it,i)=>{
    const a=doc.splitTextToSize((i+1)+'. '+it[0],W-2*m),b=it[1]?doc.splitTextToSize(it[1],W-2*m-6):[];
    if(y+a.length*5+b.length*4.6+3>lim){doc.addPage();y=m+6}
    doc.setFont('helvetica','bold');doc.text(a,m,y);y+=a.length*5;
    if(b.length){doc.setFont('helvetica','normal');doc.text(b,m+6,y);y+=b.length*4.6}
    y+=3});
  if(tipo==='orden'&&c.dx&&c.dx.length){const t=doc.splitTextToSize('Diagnóstico presuntivo: '+c.dx.map(d=>(d.c?d.c+' ':'')+d.d).join('; '),W-2*m);if(y+t.length*4.6>lim){doc.addPage();y=m+6}doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.text(t,m,y+2)}
  const ly=H-m-12,lx=W-m-58;
  const img=(d,x,mw,mh)=>{try{const ip=doc.getImageProperties(d),r=Math.min(mw/ip.width,mh/ip.height);doc.addImage(d,x,ly-1-ip.height*r,ip.width*r,ip.height*r)}catch(e){}};
  if(fi.firma)img(fi.firma,lx+6,46,20);
  if(fi.sello)img(fi.sello,Math.max(m,lx-34),30,24);
  doc.line(lx,ly,W-m,ly);doc.setFont('helvetica','bold');doc.setFontSize(9);doc.text(md.nombre||'Firma y sello',lx+29,ly+4,{align:'center'});
  doc.setFont('helvetica','normal');doc.setFontSize(8);if(md.reg)doc.text('Reg. Prof. N° '+md.reg,lx+29,ly+8,{align:'center'});
  const name=(tipo==='receta'?'Receta':'Orden')+' '+p.nombre.replace(/[^\p{L}\p{N} ]/gu,'')+' '+c.fecha+'.pdf';
  const w=window.open(doc.output('bloburl'),'_blank');if(!w)doc.save(name);
  log('Generó '+(tipo==='receta'?'receta':'orden')+' en PDF',p.nombre);
}
function bajar(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}

  <div class="panel"><h2>Pagos del ${esc(fdate(f))}</h2>${ts.length?`<div class="scroll"><table><thead><tr><th>Hora</th><th>Paciente</th><th>Situación</th><th>Medio</th><th>Convenio</th><th class="n">Monto</th><th></th></tr></thead><tbody>${ts.map(t=>{const g=t.pago||{};return `<tr><td>${t.hora}</td><td>${esc(pacN(t))}</td><td><span class="pill ${g.e==='pagado'?'e-atendido':g.e==='debe'?'e-ausente':g.e==='convenio'?'e-pendiente':'neutral'}">${PAGO[g.e||'']}</span></td><td>${g.e==='pagado'?MEDIOS[g.medio||'efectivo']:'—'}</td><td>${esc(g.conv||'—')}</td><td class="n">${g.monto?gs(g.monto):'—'}</td><td><button class="btn s" data-a="turno" data-f="${f}" data-id="${t.id}">Registrar pago</button></td></tr>`}).join('')}</tbody></table></div>`:'<p class="muted">No hay turnos en esta fecha.</p>'}</div>
  <div class="panel"><h2>Cierre de caja</h2>${ci?`<p><span class="pill e-atendido">Caja cerrada</span> a las ${esc(new Date(ci.t).toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'}))}. Efectivo según sistema ${gs(ci.ef)}, contado ${gs(ci.contado)}, diferencia <b>${gs(ci.contado-ci.ef)}</b>.</p>`:''}
    <form data-s="cierre" class="row"><label>Efectivo contado en caja<input type="number" name="contado" id="cj_contado" min="0" step="any" required value="${ci?ci.contado:''}"></label><button class="btn p" style="align-self:flex-end">${ci?'Volver a cerrar':'Cerrar caja del día'}</button></form>
    <p class="small muted">El cierre compara el efectivo contado con ${gs(tot.efectivo)} registrado en efectivo. Transferencias y tarjetas se verifican contra el extracto.</p></div>`;

/* ---------- RECORDATORIOS ---------- */
function waNum(t){let d=String(t||'').replace(/\D/g,'');if(!d)return'';const pre=String(cfg().prefijo||'595');if(d.startsWith('0'))d=pre+d.slice(1);else if(d.length<=9)d=pre+d;return d}
const RESET={rec:false,recAuto:null,recErr:null,conf:null};
const REC_TPL='Hola {paciente}, le recordamos su turno en {consultorio} el {fecha} a las {hora} con {medico}. Responda SI para confirmar o NO si no puede asistir. Gracias.';
const cfgR=()=>D.config.recordatorios||{};
function recMsg(f,t){
  const m=medN(t.mid),v={paciente:pacN(t),consultorio:cfg().nombre||(EMP&&EMP.nombre)||'el consultorio',fecha:fdate(f,{weekday:'long',day:'numeric',month:'long'}),hora:t.hora,medico:m};
  let s=cfgR().plantilla||REC_TPL;if(!m)s=s.replace(/ con \{medico\}/g,'');
  return s.replace(/\{(paciente|consultorio|fecha|hora|medico)\}/g,(_,k)=>v[k]);
}
const hhmm=ms=>new Date(ms).toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'});
function hace(ms){const m=Math.round((Date.now()-ms)/60000);return m<60?m+' min':m<1440?Math.round(m/60)+' h':Math.round(m/1440)+' días'}
function robotBox(){
  const r=D.config.robot,c=cfgR(),on=r&&r.visto&&Date.now()-r.visto<25*60000&&r.estado==='conectado';
  const est=!r?'<span class="dot"></span><span><b>Robot no instalado.</b> Los recordatorios se envían a mano con los botones de abajo.</span>'
    :on?`<span class="dot on"></span><span><b>Robot conectado</b>${r.numero?' · WhatsApp '+esc(r.numero):''} · última señal hace ${hace(r.visto)}${r.fechaHoy===hoy()?' · '+(r.enviadosHoy||0)+' enviados hoy':''}</span>`
    :`<span class="dot off"></span><span><b>Robot desconectado</b> · ${r.estado==='qr'?'esperando que se escanee el código QR':'última señal hace '+hace(r.visto||0)}. Revisá que la PC del robot esté encendida.</span>`;
  const ro=admin()?'':'disabled';
  return `<div class="panel"><h2>Envío automático por WhatsApp</h2><div class="rbt">${est}</div>
  <form data-s="recfg" class="form">
    <label>Envío automático<select name="activo" id="rc_activo" ${ro}><option value="1" ${c.activo?'selected':''}>Activado</option><option value="0" ${c.activo?'':'selected'}>Desactivado</option></select></label>
    <label>Avisar<select name="anticip" id="rc_anticip" ${ro}>${[[1,'El día anterior al turno'],[2,'Dos días antes'],[0,'El mismo día del turno']].map(([k,l])=>`<option value="${k}" ${(c.anticip??1)==k?'selected':''}>${l}</option>`).join('')}</select></label>
    <label>Enviar desde las<input type="time" name="desde" id="rc_desde" value="${esc(c.desde||'17:00')}" ${ro}></label>
    <label>Hasta las<input type="time" name="hasta" id="rc_hasta" value="${esc(c.hasta||'20:00')}" ${ro}></label>
    <label class="full">Mensaje<textarea name="plantilla" id="rc_plantilla" rows="3" ${ro}>${esc(c.plantilla||REC_TPL)}</textarea></label>
    <p class="full small muted vars">Se reemplazan solos: <code>{paciente}</code> <code>{fecha}</code> <code>{hora}</code> <code>{medico}</code> <code>{consultorio}</code>. Si el paciente responde SI o NO, el turno queda marcado como confirmado o “no viene”.</p>
    ${admin()?'<div class="full row"><button class="btn p">Guardar</button></div>':'<p class="full small muted">Solo el administrador cambia esta configuración.</p>'}
  </form></div>`;
}
function recEstado(t){
  if(t.conf===true)return '<span class="pill e-atendido">Confirmó</span>';
  if(t.conf===false)return '<span class="pill e-ausente">No viene</span>';
  if(t.recAuto&&t.rec)return `<span class="pill neutral">Robot ${hhmm(t.recAuto)}</span>`;
  if(t.rec)return '<span class="pill neutral">Enviado</span>';
  if(t.recErr)return `<span class="pill e-ausente" title="${esc(t.recErr)}">No enviado</span><div class="small muted">${esc(t.recErr)}</div>`;
  return '<span class="muted">—</span>';
}

  return `<div class="vh"><h1>Recordatorios</h1><input type="date" id="recf" data-c="recf" value="${f}" aria-label="Fecha de los turnos"></div>

/* ---------- REPORTES ---------- */
function vReportes(){
  const mth=S.repM;ensureMonth(mth);const n=new Date(+mth.slice(0,4),+mth.slice(5,7),0).getDate(),per=[];let at=0,au=0,pe=0;
  for(let i=1;i<=n;i++){const ts=Object.values((D.agenda[mth+'-'+p2(i)]||{}).turnos||{});const a=ts.filter(t=>t.estado==='atendido').length;per.push(a);at+=a;au+=ts.filter(t=>t.estado==='ausente').length;pe+=ts.filter(t=>t.estado==='pendiente').length}
  const mx=Math.max(1,...per),nuevos=Object.values(D.pacientes).filter(p=>(p.reg||'').startsWith(mth)).length,h=hoy(),th=Object.entries((D.agenda[h]||{}).turnos||{}).map(([id,t])=>Object.assign({id},t)).sort((a,b)=>a.hora.localeCompare(b.hora));
  const aus=at+au?Math.round(au*100/(at+au)):0;
  const pm={};for(let i=1;i<=n;i++)Object.values((D.agenda[mth+'-'+p2(i)]||{}).turnos||{}).forEach(t=>{const k=t.mid||'';const r=pm[k]||(pm[k]={tot:0,at:0,au:0,pe:0,pac:new Set(),cob:0,conf:0});r.tot++;r[t.estado==='atendido'?'at':t.estado==='ausente'?'au':'pe']++;if(t.pid)r.pac.add(t.pid);if(t.conf===true)r.conf++;const g=t.pago||{};if(g.e==='pagado')r.cob+=+g.monto||0});
  const pmx=Math.max(1,...Object.values(pm).map(r=>r.at)),pr=Object.entries(pm).sort((a,b)=>b[1].at-a[1].at);
  return `<div class="vh"><h1>Reportes</h1><div class="row"><input type="month" id="repm" data-c="repm" value="${mth}" aria-label="Mes"><button class="btn" data-a="csv">Exportar mes en CSV</button></div></div>
  <div class="stats"><div class="stat"><b>${at}</b><span>Pacientes atendidos en el mes</span></div><div class="stat"><b>${au}</b><span>Ausentes (${aus} %)</span></div><div class="stat"><b>${pe}</b><span>Turnos pendientes</span></div><div class="stat"><b>${nuevos}</b><span>Pacientes nuevos</span></div></div>
  <div class="panel"><h2>Por médico</h2>${pr.length?`<div class="scroll"><table><thead><tr><th>Médico</th><th class="n">Turnos</th><th class="n">Atendidos</th><th></th><th class="n">Ausentes</th><th class="n">Pendientes</th><th class="n">Asistencia</th><th class="n">Pacientes</th><th class="n">Cobrado</th></tr></thead><tbody>${pr.map(([k,r])=>{const a=r.at+r.au?Math.round(r.at*100/(r.at+r.au))+' %':'—';return `<tr><td style="white-space:nowrap">${esc(medN(k)||'Sin médico asignado')}</td><td class="n">${r.tot}</td><td class="n"><b>${r.at}</b></td><td style="width:22%"><div class="hb" role="img" aria-label="${r.at} atendidos"><i style="width:${r.at*100/pmx}%"></i></div></td><td class="n">${r.au}</td><td class="n">${r.pe}</td><td class="n">${a}</td><td class="n">${r.pac.size}</td><td class="n" style="white-space:nowrap">${gs(r.cob)}</td></tr>`}).join('')}</tbody></table></div><p class="small muted">Asistencia: atendidos sobre (atendidos + ausentes). Cobrado: pagos registrados como pagados en caja.</p>`:'<p class="muted">No hay turnos en este mes.</p>'}</div>
  <div class="panel"><h2>Atendidos por día</h2><div style="padding-top:18px"><div class="bars" role="img" aria-label="Pacientes atendidos por día del mes">${per.map((v,i)=>`<div style="height:${v*100/mx}%" title="Día ${i+1}: ${v}">${v?`<span>${v}</span>`:''}</div>`).join('')}</div><div class="axis">${per.map((v,i)=>`<span>${(i+1)%5===0||i===0?i+1:''}</span>`).join('')}</div></div></div>
  <div class="panel"><h2>Citas de hoy · ${esc(fdate(h))}</h2>${th.length?`<div class="scroll"><table><thead><tr><th>Hora</th><th>Paciente</th><th>Médico</th><th>Estado</th></tr></thead><tbody>${th.map(t=>`<tr><td>${t.hora}</td><td>${esc(pacN(t))}</td><td>${esc(medN(t.mid))}</td><td><span class="pill e-${t.estado}">${EST[t.estado]}</span></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Hoy no hay citas cargadas.</p>'}</div>`;
}

const xc=p=>Math.max(1,+p.xcaja||1);
const pU=p=>+p.punid||Math.round((+p.pcaja||0)/xc(p));

const stockU=p=>lotesOf(p).reduce((s,l)=>s+l.c,0);

function sem(v){const h=hoy();return v<h?'r':v<=addD(h,alertaD())?'y':'g'}

function fmtU(p,u){const x=xc(p),uc=p.ucompra||'Caja',uv=p.uventa||'Unidad';if(x===1)return u+' '+(u===1?uc.toLowerCase():plu(uc));const c=Math.floor(u/x),r=u%x;return [c?c+' '+(c===1?uc.toLowerCase():plu(uc)):'',r?r+' '+(r===1?uv.toLowerCase():plu(uv)):''].filter(Boolean).join(' + ')||'0'}
function alloc(p,u){const r=[];for(const l of lotesOf(p).filter(l=>l.v>=hoy())){if(u<=0)break;const t=Math.min(u,l.c);r.push({lid:l.lid,l:l.l,v:l.v,c:t});u-=t}return u>0?null:r}
function alertasInv(){

    a.frio=!last?'Falta registrar hoy la temperatura de la heladera.':(last.t<mn||last.t>mx)?`Última temperatura ${last.t} °C, fuera del rango ${mn} a ${mx} °C. Revisá la heladera y los productos refrigerados.`:null}
  return a;
}

function letras(n){
  n=Math.round(Math.abs(n));if(!n)return 'cero';
  const U=['','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'],
    DD=['','','','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'],CC=['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
  const c99=x=>x<30?U[x]:DD[Math.floor(x/10)]+(x%10?' y '+U[x%10]:''),c999=x=>x===100?'cien':(CC[Math.floor(x/100)]+(x%100?' '+c99(x%100):'')).trim(),ap=s=>s.replace(/veintiuno$/,'veintiún').replace(/uno$/,'un');
  const mm=Math.floor(n/1e6),mi=Math.floor(n%1e6/1e3),r=n%1e3,o=[];
  if(mm)o.push(mm===1?'un millón':ap(c999(mm))+' millones');if(mi)o.push(mi===1?'mil':ap(c999(mi))+' mil');if(r)o.push(c999(r));return o.join(' ');
}

async function anular(id){
  const v=D.ventas[id];if(!v)return;
  const grupo=ventasL().filter(x=>x.grupo===v.grupo&&!x.anulada),st=grupo.find(x=>x.stock),now=Date.now();
  try{
    const b=fs.batch();
    grupo.forEach(x=>b.update(col('ventas').doc(x.id),{anulada:true,anuladaPor:UDOC.nombre||uName(UDOC),anuladaT:now}));
    if(st)st.items.forEach(i=>(i.lotes||[]).forEach(l=>{b.update(col('productos').doc(i.pid),{['lotes.'+l.lid+'.c']:firebase.firestore.FieldValue.increment(l.c)});b.set(col('movs').doc(),{t:now,tipo:'anulación',pid:i.pid,n:i.n,l:l.l,c:l.c,ref:st.nro,uid:ME.uid})}));
    await b.commit();grupo.forEach(x=>{D.ventas[x.id].anulada=true});log('Anuló venta',grupo.map(x=>x.nro).join(' y '));toast('Venta anulada y stock devuelto');draw();
  }catch(e){werr(e)}
}

async function crearUsuario(us,pass,doc){

  const email=us+'.'+nid()+UDOM,sec=cuentaSec(),c=await sec.createUserWithEmailAndPassword(email,pass);await sec.signOut();

function imgData(file,maxW,type,maxLen){return new Promise(res=>{if(!file||!file.size)return res(null);const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{let w=Math.min(maxW,im.width),u;do{const c=document.createElement('canvas');c.width=w;c.height=Math.round(im.height*w/im.width);const x=c.getContext('2d');if(type==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(im,0,0,c.width,c.height);u=c.toDataURL(type,.8);w=Math.round(w*.75)}while(u.length>maxLen&&w>60);res(u)};im.onerror=()=>res(null);im.src=r.result};r.onerror=()=>res(null);r.readAsDataURL(file)})}
const fileData=f=>new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>res(null);r.readAsDataURL(f)});

function estEmp(e){
  if(e.estado!=='activa')return['Suspendida','e-ausente',0];
  if(e.vence==null)return['De por vida','e-atendido',1];
  const dd=Math.ceil((e.vence.toDate()-new Date())/864e5),f=e.vence.toDate().toLocaleDateString('es',{day:'2-digit',month:'short',year:'numeric'});
  if(dd<=0)return['Vencida el '+f,'e-ausente',0];
  if(dd<=7)return['Vence en '+dd+' día'+(dd===1?'':'s'),'e-pendiente',1];
  return['Activa hasta '+f,'e-atendido',1];
}

    if(v.id)write('productos',id,p,'merge');else write('productos',id,Object.assign(p,{lotes:{}}),'set');

  lote(v){const p=D.productos[v.id],u=Math.round(+v.cajas||0)*xc(p)+Math.round(+v.sueltas||0);if(u<=0){toast('Ingresá una cantidad mayor a cero.',1);return}
    const l=v.l.trim(),ex=Object.entries(p.lotes||{}).find(([k,x])=>x.l===l&&x.v===v.v),lid=ex?ex[0]:nid(),FV=firebase.firestore.FieldValue,now=Date.now();
    const upd=ex?{['lotes.'+lid+'.c']:FV.increment(u)}:{['lotes.'+lid]:{l,v:v.v,c:u,ing:hoy(),costo:+v.costo||0,prov:v.prov.trim(),fac:v.fac.trim()}};
    if(ex){p.lotes[lid].c+=u}else{p.lotes=p.lotes||{};p.lotes[lid]=upd['lotes.'+lid]}render();
    const b=fs.batch();b.update(col('productos').doc(v.id),upd);b.set(col('movs').doc(),{t:now,tipo:'ingreso',pid:v.id,n:p.nombre,l,c:u,ref:v.fac.trim(),uid:ME.uid});b.commit().catch(werr);
    log('Ingresó lote',p.nombre+' · lote '+l+' · '+fmtU(p,u));closeM();toast('Lote ingresado: '+fmtU(p,u))},
  ajus(v){const p=D.productos[v.id],l=p.lotes[v.lid],c=Math.max(0,Math.round(+v.c||0)),nuevo=v.tipo==='baja'?Math.max(0,l.c-c):c,dif=nuevo-l.c;if(!dif){closeM();return}
    const b=fs.batch();b.update(col('productos').doc(v.id),{['lotes.'+v.lid+'.c']:firebase.firestore.FieldValue.increment(dif)});b.set(col('movs').doc(),{t:Date.now(),tipo:v.tipo==='baja'?'baja':'ajuste',pid:v.id,n:p.nombre,l:l.l,c:dif,ref:v.motivo.trim(),uid:ME.uid});b.commit().catch(werr);
    l.c=nuevo;render();log(v.tipo==='baja'?'Dio de baja stock':'Ajustó stock',p.nombre+' · lote '+l.l+' · '+(dif>0?'+':'')+dif+' · '+v.motivo.trim());closeM();toast('Stock actualizado')},
  temp(v,form){const t=Math.round(+v.t*10)/10;if(!isFinite(t)){return}const h=hoy(),d=new Date(),r={h:p2(d.getHours())+':'+p2(d.getMinutes()),t,n:UDOC.nombre||uName(UDOC)};
    col('temperaturas').doc(h).set({fecha:h,r:firebase.firestore.FieldValue.arrayUnion(r)},{merge:true}).catch(werr);D.temperaturas[h]=D.temperaturas[h]||{fecha:h,r:[]};D.temperaturas[h].r=(D.temperaturas[h].r||[]).concat(r);
    const mn=+(cfF().tmin??2),mx=+(cfF().tmax??8);if(t<mn||t>mx){log('Temperatura de heladera fuera de rango',t+' °C');toast('Temperatura fuera de rango: revisá la heladera.',1)}else toast('Temperatura registrada');draw()},
  traz(v){buscarTraz(v.l)},

  farm(v){const seguros=v.seguros.split('\n').map(l=>l.split(';').map(x=>x.trim())).filter(a=>a[0]).map(a=>({n:a[0],pct:Math.min(100,Math.max(0,+a[1]||0)),ruc:a[2]||''}));
    write('config','farmacia',{seguros,alertaDias:Math.max(1,Math.round(+v.alertaDias||90)),tmin:+v.tmin,tmax:+v.tmax},'set');log('Configuró seguros y farmacia');toast('Guardado')},
  async login(v,form){const b=form.querySelector('button');b.disabled=true;try{await auth.signInWithEmailAndPassword(await cuentaDe(v.email),v.pass)}catch(e){b.disabled=false;toast(authMsg(e),1)}},
  async cambiar(v){
    if(v.p1!==v.p2){toast('Las contraseñas no coinciden.',1);return}
    if(v.p1.length<8||v.p1==='123456'||/^(\d)\1+$/.test(v.p1)){toast('Elegí una contraseña más segura, de al menos 8 caracteres.',1);return}
    try{
      await ME.updatePassword(v.p1);
      const ref=fs.doc('usuarios/'+ME.uid);
      if(UDOC)await ref.update({debeCambiar:false});else await ref.set({rol:'dev',nombre:'Desarrollador',email:ME.email.toLowerCase(),debeCambiar:false,activo:true,creado:Date.now()});
      toast('Contraseña actualizada');entrar(ME);
    }catch(e){toast(authMsg(e),1)}
  },
  turno(v){
    const pid=findPac(v.pac);if(!pid){toast('Elegí un paciente de la lista, o registralo primero.',1);return}
    const id=v.id||nid(),old=v.id?D.agenda[v.f0].turnos[v.id]:{};
    const t=Object.assign({},old,v.id&&(old.hora!==v.hora||v.f0!==v.fecha)?RESET:{},{hora:v.hora,pid,pn:D.pacientes[pid].nombre,mid:v.mid,motivo:v.motivo.trim(),estado:v.estado,pago:{e:v.pe,monto:+v.monto||0,medio:v.medio,conv:v.conv.trim()}});
    if(v.id&&v.f0!==v.fecha)delKey('agenda',v.f0,'turnos',id);
    write('agenda',v.fecha,{fecha:v.fecha,turnos:{[id]:t}},'merge');

  },
  pac(v){
    const id=v.id||nid(),old=v.id?D.pacientes[v.id]:{reg:hoy()};
    write('pacientes',id,Object.assign({},old,{nombre:v.nombre.trim(),ci:v.ci.trim(),nac:v.nac,tel:v.tel.trim(),mail:v.mail.trim(),dir:v.dir.trim(),emN:v.emN.trim(),emT:v.emT.trim(),cob:v.cob.trim()}),'set');
    if(medico()&&'ale' in v)write('clinico',id,{ale:v.ale.trim(),med:v.med.trim(),ant:v.ant.trim()},'merge');
    log(v.id?'Modificó ficha de paciente':'Registró paciente',v.nombre.trim());closeM();toast('Ficha guardada');
    if(!v.id&&S.view!=='agenda'){S.pid=id;S.view='paciente';openClin(id);draw()}
  },
  cons(v){
    syncRx();const cid=v.cid||nid();
    const c={fecha:v.fecha,mid:v.mid,motivo:v.motivo.trim(),dx:S.t.dx,notas:v.notas.trim(),rx:S.t.rx.filter(r=>r.m),est:v.est.split('\n').map(s=>s.trim()).filter(Boolean)};
    if(D.clinico[v.pid]&&D.clinico[v.pid].cons)delete D.clinico[v.pid].cons[cid];
    write('clinico',v.pid,{cons:{[cid]:c}},'merge');
    if(v.tid&&D.agenda[v.tf]&&D.agenda[v.tf].turnos[v.tid])write('agenda',v.tf,{turnos:{[v.tid]:{estado:'atendido'}}},'merge');
    log(v.cid?'Modificó consulta del historial':'Registró consulta',D.pacientes[v.pid].nombre+' · '+v.fecha);
    S.pid=v.pid;S.view='paciente';closeM();draw();toast('Consulta guardada. La receta y la orden están en el historial.');
  },
  cierre(v){
    const f=S.cajaF,ts=Object.values((D.agenda[f]||{}).turnos||{});let ef=0,tr=0,tj=0;
    ts.forEach(t=>{const g=t.pago||{};if(g.e==='pagado'){const m=+g.monto||0;if(g.medio==='transferencia')tr+=m;else if(g.medio==='tarjeta')tj+=m;else ef+=m}});
    write('agenda',f,{fecha:f,cierre:{t:Date.now(),uid:ME.uid,ef,tr,tj,contado:+v.contado||0}},'merge');
    log('Cerró caja',f+' · efectivo '+ef+' · contado '+(+v.contado||0));draw();toast('Caja cerrada');
  },
  recfg(v){const h=t=>/^\d\d:\d\d$/.test(t)?t:'';const d={activo:v.activo==='1',anticip:+v.anticip||0,desde:h(v.desde)||'17:00',hasta:h(v.hasta)||'20:00',plantilla:v.plantilla.trim()||REC_TPL};if(d.hasta<=d.desde){toast('La hora “hasta” debe ser posterior a “desde”.',1);return}write('config','recordatorios',d,'set');log('Configuró recordatorios automáticos',(d.activo?'Activado':'Desactivado')+' · '+d.desde+'–'+d.hasta);toast('Configuración guardada')},
  cfg(v){write('config','consultorio',{nombre:v.nombre.trim(),direccion:v.direccion.trim(),telefono:v.telefono.trim(),ruc:v.ruc.trim(),hoja:v.hoja,moneda:v.moneda.trim()||'Gs.',prefijo:v.prefijo.replace(/\D/g,'')||'595'},'set');log('Modificó datos del consultorio');draw();toast('Datos guardados')},
  async med(v,form){
    const id=v.id||nid(),old=v.id?D.medicos[v.id]:{};
    const o={nombre:v.nombre.trim(),esp:v.esp.trim(),reg:v.reg.trim()};if(old.demo)o.demo=true;

  },
  async user(v,form){
    const b=form.querySelector('button');b.disabled=true;
    const us=v.email.trim().toLowerCase();if(!uOk(us)){b.disabled=false;toast('El usuario debe tener 3 a 30 letras o números, sin espacios.',1);return}
    try{await crearUsuario(us,v.pass,{empresaId:v.eid,rol:v.rol,nombre:v.nombre.trim()});if(MODE==='app')log('Creó usuario',us+' · '+ROLN[v.rol]);closeM();modal(`<h2>Usuario creado</h2><div class="panel"><div>Usuario: <b>${esc(us)}</b></div><div>Contraseña temporal: <b>${esc(v.pass)}</b></div></div><p class="muted small">Deberá cambiar la contraseña en su primer ingreso.</p><div class="row"><button class="btn p" data-a="close">Listo</button></div>`)}

  async emp(v,form){
    const b=form.querySelector('button');b.disabled=true;

      if(v.id){await fs.doc('empresas/'+v.id).update({nombre:v.nombre.trim(),ruc:v.ruc.trim(),contacto:v.contacto.trim(),tel:v.tel.trim(),maxUsuarios:+v.max||0,vence:v.vence?firebase.firestore.Timestamp.fromDate(new Date(pd(v.vence).getTime()+86399000)):null});closeM();toast('Consultorio actualizado');return}

      modal(`<h2>Acceso generado</h2><div class="panel"><div>Usuario: <b>${esc(us)}</b></div><div>Contraseña temporal: <b>${esc(v.pass)}</b></div></div><p class="muted small">Entregale estos datos. Deberá cambiar la contraseña al ingresar.</p><div class="row"><button class="btn p" data-a="close">Listo</button></div>`);

};
document.addEventListener('submit',e=>{const f=e.target,k=f.dataset.s;if(!k)return;e.preventDefault();const v={};new FormData(f).forEach((x,n)=>{if(typeof x==='string')v[n]=x});F[k](v,f)});

/* arrastrar y soltar */
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('[data-drag]');if(c){e.dataTransfer.setData('text/plain',c.dataset.drag);e.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragover',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');if(z){e.preventDefault();document.querySelectorAll('.over').forEach(x=>x!==z&&x.classList.remove('over'));z.classList.add('over')}});
document.addEventListener('dragend',()=>document.querySelectorAll('.over').forEach(x=>x.classList.remove('over')));
document.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');if(!z)return;e.preventDefault();z.classList.remove('over');const a=(e.dataTransfer.getData('text/plain')||'').split('|');if(a.length===2)moveTurno(a[0],a[1],z.dataset.fecha,z.dataset.hora)});

/* ---------- arranque ---------- */
(function(){
  if(!window.firebase){screen('<h1>Sin conexión</h1><p>No se pudo cargar el sistema. Revisá tu conexión a internet y recargá la página.</p>');return}
  if(!FB.apiKey||/^PEGAR/.test(FB.apiKey)){screen('<h1>Falta conectar la base de datos</h1><p>Abrí <b>index.html</b>, buscá <code>const FB</code> al inicio del script y pegá ahí la configuración de tu proyecto de Firebase. Los pasos están en el archivo <b>LEEME.md</b>.</p>');return}
  firebase.initializeApp(FB);auth=firebase.auth();fs=firebase.firestore();
  try{fs.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
  screen('<span class="logo">'+ic('logo')+'</span><h1>Consultorio Médico</h1><p class="muted">Abriendo…</p>');
  auth.onAuthStateChanged(entrar);
})();
